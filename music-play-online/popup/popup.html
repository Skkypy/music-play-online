<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Play Online</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .header {
      background: rgba(255,255,255,0.95);
      padding: 14px 16px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .header-btn {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .header .header-btn:hover { background: rgba(102,126,234,0.1); }
    .header .header-btn:disabled { opacity: 0.3; cursor: default; }

    .view {
      background: rgba(255,255,255,0.95);
      margin: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .view-title {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 13px;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }
    .list-body {
      max-height: 400px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f5f5f5;
    }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: #f5f5f5; }
    .playlist-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center;
      justify-content: center;
      color: white; font-size: 18px;
      flex-shrink: 0;
    }
    .playlist-info { flex: 1; min-width: 0; }
    .playlist-name {
      font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .playlist-meta {
      font-size: 11px; color: #999; margin-top: 2px;
    }
    .playlist-load-btn, .playlist-del {
      background: none; border: none;
      cursor: pointer; padding: 4px 6px; font-size: 16px;
      transition: color 0.2s;
    }
    .playlist-load-btn { color: #667eea; }
    .playlist-load-btn:hover { color: #764ba2; }
    .playlist-del { color: #ccc; }
    .playlist-del:hover { color: #f5576c; }

    .song-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #f5f5f5;
    }
    .song-item:last-child { border-bottom: none; }
    .song-item:hover { background: #f5f5f5; }
    .song-cover {
      width: 36px; height: 36px;
      border-radius: 6px; object-fit: cover;
      background: #eee; flex-shrink: 0;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .song-author {
      font-size: 11px; color: #999; margin-top: 2px;
    }
    .song-play-icon {
      color: #667eea; font-size: 14px; opacity: 0;
      transition: opacity 0.2s;
    }
    .song-item:hover .song-play-icon { opacity: 1; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: #888;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state p { font-size: 13px; }

    .footer {
      text-align: center; padding: 12px;
      color: rgba(255,255,255,0.8); font-size: 11px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <button class="header-btn" id="backBtn" disabled><i class="fa fa-arrow-left"></i> 返回</button>
    <h1><i class="fa fa-music"></i> 我的歌单</h1>
    <span style="width:60px"></span>
  </div>

  <div class="view" id="playlistListView">
    <div class="view-title"><i class="fa fa-list"></i> 已保存的歌单</div>
    <div class="list-body" id="playlistListBody">
      <div class="empty-state">
        <div class="icon"><i class="fa fa-bookmark-o"></i></div>
        <p>暂无保存的歌单<br><small style="color:#aaa">在页面浮动播放条中保存当前播放列表</small></p>
      </div>
    </div>
  </div>

  <div class="view hidden" id="songListView">
    <div class="view-title"><i class="fa fa-music" id="songListTitle"></i></div>
    <div class="list-body" id="songListBody">
      <div class="empty-state"><p>歌单为空</p></div>
    </div>
  </div>

  <div class="footer">
    点击歌曲播放 · 在页面浮动条保存歌单
  </div>

  <script src="popup.js"></script>
</body>
</html>
